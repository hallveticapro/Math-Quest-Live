kind = "web"
previewPath = "/"
title = "MathQuest Live"
version = "1.0.0"
id = "artifacts/mathquest-live"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18567

[services.development]
run = "pnpm --filter @workspace/mathquest-live run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mathquest-live", "run", "build" ]
publicDir = "artifacts/mathquest-live/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18567"
BASE_PATH = "/"
