services:
  mathquest-live:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      ENABLE_IMAGE_GENERATION: ${ENABLE_IMAGE_GENERATION:-false}
      IMAGE_MODE: ${IMAGE_MODE:-milestones}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-openai}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-1-mini}
      IMAGE_QUALITY: ${IMAGE_QUALITY:-medium}
      IMAGE_SIZE: ${IMAGE_SIZE:-1024x1024}
      IMAGE_STYLE: ${IMAGE_STYLE:-cartoon-fantasy}
      IMAGE_TIMEOUT_MS: ${IMAGE_TIMEOUT_MS:-45000}
      IMAGE_STORAGE_MODE: ${IMAGE_STORAGE_MODE:-memory}
      PORT: 3000
      NODE_ENV: production
